# Extras/customization layer for the OTel Collector.
# Override this file in your fork to add exporters for your own observability backend.
#
# This file is intentionally empty. It is always loaded last, giving forks
# a stable, well-defined seam to customize without touching upstream files.
#
# IMPORTANT: The OTel Collector merges config files but REPLACES arrays, not appends.
# If you want to keep the default observability stack alongside your own exporters,
# you must explicitly repeat the upstream exporter names in your pipeline definitions.
#
# Upstream exporter names depend on which otel-collector command variant is active
# (see compose.yaml vs. compose.observability.yaml's otel-collector override):
#   minimal (compose.yaml only)        traces: debug, span_metrics
#   + compose.observability.yaml       traces: otlp_grpc/jaeger, debug, span_metrics
# Referencing an exporter that isn't defined in the active variant is a fatal
# config error at collector startup, not a warning.

exporters:
  # Checkly's Hosted OpenTelemetry ingestion only documents a gRPC endpoint
  # (no working HTTP route was found at otel.eu-west-1.checklyhq.com/v1/traces - 502).
  otlp/checkly:
    endpoint: otel.eu-west-1.checklyhq.com:4317
    headers:
      authorization: ${env:CHECKLY_OTEL_API_KEY}

service:
  pipelines:
    traces:
      exporters: [debug, span_metrics, otlp/checkly]  # repeat upstream exporters (minimal mode)
