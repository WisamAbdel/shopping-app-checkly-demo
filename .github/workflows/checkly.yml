# DEMO ONLY - not a functional workflow. Every line below is commented out
# on purpose; this file exists purely to show what a Checkly CI step could
# look like, not to actually run one.
#
# Why it's disabled: our checks currently run against a private location
# ("local-demo") backed by a Checkly agent running in local Docker, which a
# GitHub-hosted runner has no path to reach. Making this real would mean
# either standing up the app stack + a Checkly agent inside the runner (see
# run-telemetry-tests.yml for the stack-boot pattern this repo already
# uses), or pointing checks at a publicly reachable deployment instead.
